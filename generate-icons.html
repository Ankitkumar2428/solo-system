<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  // Background
  ctx.fillStyle = '#06060e';
  ctx.fillRect(0,0,s,s);
  // Rounded rect
  ctx.beginPath();
  const r = s * 0.15;
  ctx.roundRect(s*0.08, s*0.08, s*0.84, s*0.84, r);
  const grad = ctx.createLinearGradient(0,0,s,s);
  grad.addColorStop(0, '#4169E1');
  grad.addColorStop(1, '#7B2FBE');
  ctx.fillStyle = grad;
  ctx.fill();
  // Sword emoji
  ctx.font = `bold ${s*0.5}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚔️', s/2, s/2);
  return canvas.toDataURL('image/png');
}
const d192 = drawIcon(document.getElementById('c192'));
const d512 = drawIcon(document.getElementById('c512'));
const a192 = document.createElement('a');
a192.href = d192; a192.download = 'icon-192.png'; a192.textContent = 'Download 192px icon'; a192.style.display='block';
document.body.appendChild(a192);
const a512 = document.createElement('a');
a512.href = d512; a512.download = 'icon-512.png'; a512.textContent = 'Download 512px icon'; a512.style.display='block';
document.body.appendChild(a512);
</script>
</body>
</html>
